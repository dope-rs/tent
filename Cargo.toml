[workspace]
members = ["codegen"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/dope-rs/tent"

[package]
name = "tent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Lightweight HTML/CSS template engine"
license = "MIT"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
tent_codegen = { path = "codegen", version = "=0.2.2" }
